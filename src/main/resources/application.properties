spring.application.name=drone-simulator
server.port=8080
server.servlet.context-path=/fleet-overview

# Fleet size — override with env vars at runtime
simulator.drone-count=${SIMULATOR_DRONE_COUNT:5}
simulator.ship-count=${SIMULATOR_SHIP_COUNT:2}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ─── BindPlane ───────────────────────────────────────────────────────────────
# Override these env vars at container/process runtime:
#   BINDPLANE_HOST           — hostname or IP of the BindPlane agent
#   BINDPLANE_GRPC_PORT      — gRPC port (BindPlane default: 4318)
#   BINDPLANE_HTTP_PORT      — HTTP port (BindPlane default: 4317)
#   BINDPLANE_SERVICE_NAME   — service label attached to all telemetry
#   BINDPLANE_ENABLED        — set false to disable all BindPlane export
bindplane.enabled=${BINDPLANE_ENABLED:true}
bindplane.service-name=${BINDPLANE_SERVICE_NAME:drone-simulator}
# gRPC — metrics  (BindPlane config: grpc on 4318)
bindplane.grpc-endpoint=http://${BINDPLANE_HOST:localhost}:${BINDPLANE_GRPC_PORT:4318}
# HTTP — metrics  (BindPlane config: http on 4317)
bindplane.http-endpoint=http://${BINDPLANE_HOST:localhost}:${BINDPLANE_HTTP_PORT:4317}

# Disable Spring Boot's OTLP auto-config — registry is created programmatically
# in BindPlaneMetricsConfig so we have full control and startup logging.
management.otlp.metrics.export.enabled=false
