apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drone-simulator
  labels:
    app: drone-simulator
spec:
  rules:
  # Primary: Pi-hole DNS name — resolves on all network devices automatically
  - host: drone-simulator.kind.local
    http:
      paths:
      - pathType: Prefix
        path: /fleet-overview
        backend:
          service:
            name: drone-simulator
            port:
              number: 80
  # Fallback: catches direct IP access (host header = IP, no DNS needed)
  - http:
      paths:
      - pathType: Prefix
        path: /fleet-overview
        backend:
          service:
            name: drone-simulator
            port:
              number: 80
