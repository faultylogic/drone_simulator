apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drone-simulator
  labels:
    app: drone-simulator
spec:
  rules:
  # Primary: Pi-hole DNS name — all network devices resolve this automatically
  - host: drone-simulator.kind.local
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: drone-simulator
            port:
              number: 80
  # Fallback: direct host IP access (no DNS needed)
  - host: "192.168.1.97"
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: drone-simulator
            port:
              number: 80
