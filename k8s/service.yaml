apiVersion: v1
kind: Service
metadata:
  name: drone-simulator
  labels:
    app: drone-simulator
spec:
  selector:
    app: drone-simulator
  type: LoadBalancer      # change to ClusterIP + Ingress if you have an ingress controller
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
