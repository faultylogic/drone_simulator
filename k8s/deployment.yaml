apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone-simulator
  labels:
    app: drone-simulator
spec:
  replicas: 1          # single replica — in-memory fleet state is not distributed
  selector:
    matchLabels:
      app: drone-simulator
  template:
    metadata:
      labels:
        app: drone-simulator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: drone-simulator
          image: faultylogic/drone-simulator:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ---- Environment from ConfigMap ----
          envFrom:
            - configMapRef:
                name: drone-simulator-config

          # ---- Resource limits ----
          # Scale up for large fleets (100 ships × 1000 drones = 100k objects):
          #   - 100k DronePayload objects ≈ 500 MB heap
          #   - 100 ShipPayload objects  ≈  50 MB heap
          #   - JVM + Spring overhead    ≈ 256 MB
          # Adjust limits.memory to match your fleet size.
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "8000m"
              memory: "16Gi"

          # ---- Health probes ----
          readinessProbe:
            httpGet:
              path: /fleet-overview/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /fleet-overview/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /fleet-overview/actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12    # allow up to 60 s for startup

          # ---- Graceful shutdown ----
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
